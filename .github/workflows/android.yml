name: Build Moviesta APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Extract Android project
        run: unzip -o Moviesta-Android-source.zip -d .
      - name: Build debug APK
        run: gradle --no-daemon -p Moviesta clean :app:assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Moviesta-debug-apk
          path: Moviesta/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
